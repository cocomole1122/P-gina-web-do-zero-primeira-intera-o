<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loja de acessórios</title>
    <style>
        header {
            background-color: #33658a;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid aliceblue;
        }
        main {
            background-color: #FFFFFF;
            color: #33658a;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article {
            display: flex;
            align-items: flex-start; /* Alinha a imagem no topo do texto */
            margin-bottom: 20px;
        }
        img {
            background-color: #ffffff;
            color: #2f4858;
            text-align: center;
            padding: 8px;
            height: 80px;
            width: 80px;
            margin-right: 16px; /* Adiciona espaço entre a imagem e o texto */
            object-fit: cover; /* Evita que a imagem fique distorcida */
            flex-shrink: 0; /* Impede que a imagem encolha */
        }
        .artigo-autor {
            font-weight: bold;
        }
        button {
            cursor: pointer;
            font-size: 16px; /* Aumenta o tamanho da fonte e dos ícones */
            padding: 8px 16px; /* Aumenta o tamanho interno do botão */
            background-color: #ffffff;
            color: #2f4858;
            border: 1px solid #2f4858;
            border-radius: 6px;
            margin-right: 8px; /* Separa os botões um do outro */
            display: inline-flex;
            align-items: center;
            gap: 6px; /* Espaço entre o emoji e o número */
        }
        button:hover {
            background-color: #2f4858;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <header>
        <h1>Play na Orla</h1>
        <p>esta página é para compartilhar conhecimentos sobre beach tennis</p> 
    </header>

    <main>
        <article>
            <img src="raquete.jpeg" alt="Acessórios da loja">
            <div>
                <h2>meu primeiro post</h2>
                <p class="artigo-autor">Por: Matheus Teixeira</p>
                <p>olá seja bem-vindo(a) á minha página aqui vou compartilhar conhecimentos e
                     a história do beach tennis.</p>
                <button>😊 ​<span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>

        <article>
            <img src="história.jpeg" alt="Acessórios da loja">
            <div>
                <h2>meu segundo post</h2>
                <p class="artigo-autor">Por: Matheus Teixeira</p>
                <p>A história do Beach Tennis</p>
                <button>😊​ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function(botao) {
            let curtiu = false;
            botao.addEventListener("click", function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            });
        });
    </script>
</body>
</html>
